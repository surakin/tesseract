<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The runner's default sans is DejaVu Sans, which draws monochrome outlines
       for the original emoticons (U+1F600..1F64F), hearts, planes and arrows
       itself, so they never reach the colour emoji font. Use Noto Sans, as
       KDE does, and rank Noto Color Emoji straight after it: Latin text and
       digits stay in Noto Sans (the emoji font has no letters). -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
