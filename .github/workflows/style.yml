# Code style gate: Rust (rustfmt) and C++ (clang-format) formatting.
#
# Needs no build and no Rust cache: `cargo fmt --check` only parses sources.
# clang-format is installed from PyPI at the version pinned in
# tests/clang-format-version (formatting differs between major versions).
# Both checks always run so a failure in one does not hide the other.
#
# Pull requests, pushes to main/development and manual runs run it. Pushes and
# pull requests only trigger it when they touch a file the checks read: the
# C/C++/ObjC extensions of tests/check_cxx_format.py, Rust sources, the
# formatting configs and pinned version, the Cargo manifests (cargo fmt -p
# resolves the crate through them) and this workflow. third_party/ is skipped
# by the C++ check, so changes there don't trigger it either.

name: Code style

on:
  pull_request:
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hh'
      - '**.hpp'
      - '**.m'
      - '**.mm'
      - '**.rs'
      - '!third_party/**'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'tests/clang-format-version'
      - 'tests/check_cxx_format.py'
      - '**/rustfmt.toml'
      - '**/.rustfmt.toml'
      - 'Cargo.toml'
      - 'sdk/Cargo.toml'
      - '.github/workflows/style.yml'
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hh'
      - '**.hpp'
      - '**.m'
      - '**.mm'
      - '**.rs'
      - '!third_party/**'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'tests/clang-format-version'
      - 'tests/check_cxx_format.py'
      - '**/rustfmt.toml'
      - '**/.rustfmt.toml'
      - 'Cargo.toml'
      - 'sdk/Cargo.toml'
      - '.github/workflows/style.yml'

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting (Rust and C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install clang-format (pinned)
        run: |
          pip install clang-format==$(cat tests/clang-format-version)
          clang-format --version

      - name: Install Rust (stable) with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          status=0
          cargo fmt --check -p tesseract-sdk-ffi || status=1
          python3 tests/check_cxx_format.py . || status=1
          exit $status
