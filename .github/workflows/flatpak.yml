name: Flatpak

# Offline flatpak-builder build of packaging/flatpak/ — a correctness check,
# not a publisher (see packaging/flatpak/README.md for the manual release
# process). Distinct from the workflow_dispatch-only `flatpak` job in
# package.yml: this one is PR-scoped and builds the checked-out commit
# rather than a released git tag.
on:
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'sdk/Cargo.toml'
      - 'CMakeLists.txt'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & validate manifest (offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flatpak-builder + validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # golang extension branch-pinned: org.kde.Sdk//6.9's declared
          # companion branch for org.freedesktop.Sdk.Extension.* is 24.08;
          # unpinned, `flatpak install` prompts and aborts in CI.
          flatpak install --user -y flathub \
            org.kde.Platform//6.9 org.kde.Sdk//6.9 \
            org.freedesktop.Sdk.Extension.golang//24.08

      - name: Validate AppStream metadata
        run: |
          appstreamcli validate --no-net \
            packaging/flatpak/io.github.surakin.Tesseract.metainfo.xml

      - name: Generate the manifest for this commit
        run: |
          version=$(grep -oP '(?<=^project\(Tesseract VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "Project version: $version"
          sed "s/@PROJECT_VERSION@/${version}/" \
            packaging/flatpak/io.github.surakin.Tesseract.yml.in \
            > packaging/flatpak/io.github.surakin.Tesseract.yml

      - name: Point the tesseract module at the checked-out commit
        # The generated manifest pins `tag: vX.Y.Z`, which does not exist
        # until release. Build this PR's actual code instead: a local branch
        # (so `git clone file://` from flatpak-builder can resolve it) fed to
        # the module as a `git` source. yq (mikefarah v4) is preinstalled on
        # the ubuntu-24.04 runner image.
        env:
          SRC_URL: file://${{ github.workspace }}
        run: |
          git switch -C flatpak-ci-build
          M=packaging/flatpak/io.github.surakin.Tesseract.yml
          yq -i '
            (.modules[] | select(.name == "tesseract") | .sources[0]) =
              {"type": "git", "url": strenv(SRC_URL), "branch": "flatpak-ci-build"}
          ' "$M"
          echo "--- tesseract module sources[0] ---"
          yq '.modules[] | select(.name == "tesseract") | .sources[0]' "$M"
          echo "--- source count (must stay 7) ---"
          yq '.modules[] | select(.name == "tesseract") | .sources | length' "$M"

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.github.surakin.Tesseract.yml.in', 'packaging/flatpak/cargo-sources.json', 'Cargo.lock') }}
          restore-keys: |
            flatpak-builder-

      - name: Build (offline)
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --ccache \
            --repo=repo build-dir \
            packaging/flatpak/io.github.surakin.Tesseract.yml

      - name: Validate the installed desktop file
        run: |
          desktop-file-validate \
            build-dir/files/share/applications/io.github.surakin.Tesseract.desktop

      - name: Smoke-test the built tree
        run: |
          set -eux
          test -x build-dir/files/bin/tesseract-matrix
          test -f build-dir/files/share/icons/hicolor/scalable/apps/io.github.surakin.Tesseract.svg
          test -f build-dir/files/share/metainfo/io.github.surakin.Tesseract.metainfo.xml
          test ! -e build-dir/files/share/applications/tesseract-matrix.desktop
          test ! -e build-dir/files/bin/rustc   # rust-toolchain module stripped by cleanup:

      - name: Upload built tree (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build-dir
          path: build-dir/files
          if-no-files-found: error
