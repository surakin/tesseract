name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Windows — NSIS installer (.exe) + Store MSIX, from one build
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (NSIS + Store MSIX)
    runs-on: windows-latest
    # Holds CERTUM_EMAIL / CERTUM_OTP (and any required-reviewer gate).
    environment: signing
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/windows-release/cargo/build
          cache-on-failure: true

      # resvg-py 0.3.2 only ships wheels up to cp312, so pin Python 3.12.
      # The id lets us hand the exact interpreter to CMake below — otherwise
      # find_package(Python3) picks the newest interpreter on the runner
      # (3.14 in the hosted toolcache), which has no resvg_py installed.
      - name: Set up Python (icon generation)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pillow composites the non-square MSIX assets (wide tile, splash
      # screen) — see ui/icons/generate_msix_assets.py.
      - name: Install resvg-py and Pillow (icon generation)
        run: pip install resvg-py pillow

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      # msgfmt compiles i18n/*.po into the .mo catalogs the installer ships;
      # without it CMake configures fine but packages no translations. Same
      # binaries as `winget install mlocati.GetText` (winget isn't on the
      # runner image), pinned by version and checksum. The zip is cached by
      # that checksum so most runs never touch the release URL, and the
      # download retries because GitHub release downloads intermittently 500.
      - name: Cache gettext download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gettext.zip
          key: gettext-2b999bc37b56fa052ff98578e9cb188152009f634e3a66aa8ff263a016e9c466

      - name: Install gettext (msgfmt)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\gettext.zip"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri "https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-static-64.zip" -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 15
          }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "2b999bc37b56fa052ff98578e9cb188152009f634e3a66aa8ff263a016e9c466") { throw "gettext download checksum mismatch" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\gettext"
          "$env:RUNNER_TEMP\gettext\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The Ninja generator does not auto-activate MSVC like the Visual Studio
      # generator does. Without vcvars on PATH, CMake's compiler probe can't
      # find cl.exe and silently falls back to the runner's bundled MinGW gcc.
      # This step runs vcvars and exports INCLUDE/LIB/PATH so Ninja picks MSVC.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # opus is required by matrix-sdk-ui (MSC3245 voice messages).
      # Build from source so the CRT (/MD) and generator (Ninja+MSVC) match
      # the rest of the project exactly — avoids vcpkg triplet and GITHUB_ENV
      # encoding issues.
      - name: Build opus from source
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DOPUS_BUILD_SHARED_LIBRARY=OFF `
            -DOPUS_BUILD_PROGRAMS=OFF `
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          $lib = (Resolve-Path opus-build).Path
          $inc = (Resolve-Path opus-src/include).Path
          "OPUS_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "OPUS_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV
          "OPUS_STATIC=1" >> $env:GITHUB_ENV

      # Release builds are always signed with the Certum SimplySign cloud
      # certificate via ssign (https://github.com/Le-Syl21/ssign): plain HTTPS
      # to Certum, no PFX or SimplySign Desktop. Missing secrets abort here,
      # before the long build. The `secrets` context can't be read in an
      # `if:`, so presence is checked via env.
      - name: Check Certum signing secrets
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          if (-not $env:CERTUM_EMAIL -or -not $env:CERTUM_OTP) {
            Write-Output "::error::CERTUM_EMAIL / CERTUM_OTP are missing from the 'signing' environment"
            exit 1
          }

      - name: Cache ssign
        id: ssign_cache
        uses: actions/cache@v4
        with:
          path: ~\.cargo\bin\ssign.exe
          key: ssign-0.1.8-${{ runner.os }}

      - name: Install ssign
        if: steps.ssign_cache.outputs.cache-hit != 'true'
        run: cargo install --locked ssign --version 0.1.8

      # cmake, ninja, Go, and Strawberry Perl are pre-installed on
      # windows-latest; Go and Perl satisfy the aws-lc-sys CMake builder.
      - name: Configure (Release)
        # Force CMake to use the same Python interpreter we installed
        # resvg-py into; otherwise FindPython3 picks the newest version
        # available on the runner (3.14) regardless of PATH.
        # The TESSERACT_MSIX_* repo variables (not secret — they're baked
        # into every shipped AppxManifest.xml anyway) give the Store MSIX its
        # Partner Center identity. The same exe keeps TESSERACT_GITHUB_REPO:
        # a packaged install turns the update check off at runtime.
        run: |
          cmake --preset windows-release `
            "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" `
            -DTESSERACT_BUILD_TESTS=OFF `
            "-DTESSERACT_GITHUB_REPO=${{ github.repository }}" `
            "-DTESSERACT_MSIX_STORE_IDENTITY_NAME=${{ vars.TESSERACT_MSIX_STORE_IDENTITY_NAME }}" `
            "-DTESSERACT_MSIX_STORE_PUBLISHER=${{ vars.TESSERACT_MSIX_STORE_PUBLISHER }}" `
            "-DTESSERACT_MSIX_PUBLISHER_DISPLAY_NAME=${{ vars.TESSERACT_MSIX_PUBLISHER_DISPLAY_NAME }}"

      - name: Build
        run: cmake --build build/windows-release

      # Signed in place before packaging so CPack (and the MSIX stage below)
      # pick up the signed exe. The OTP seed goes via env only, never -O.
      - name: Sign Tesseract.exe
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: ssign build/windows-release/ui/windows/Tesseract.exe

      - name: Package (CPack → NSIS)
        run: cmake --build build/windows-release --target package

      - name: Sign installer
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          $installers = @(Get-ChildItem build/windows-release/Tesseract-*.exe)
          if ($installers.Count -eq 0) { throw "no installer found to sign" }
          ssign $installers.FullName
          if ($LASTEXITCODE -ne 0) { throw "ssign failed" }

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @(Get-Item build/windows-release/ui/windows/Tesseract.exe) +
                   @(Get-ChildItem build/windows-release/Tesseract-*.exe)
          $bad = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($sig.Status) | $($sig.SignerCertificate.Subject) | timestamp: $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad = $true }
          }
          if ($bad) { throw "signature verification failed" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-windows
          path: build/windows-release/Tesseract-*.exe
          if-no-files-found: error

      # Repackages the exe built above — no second compile.
      - name: Stage, pack and validate MSIX
        run: cmake --build build/windows-release --target msix-stage msix-pack msix-validate

      # A workflow artifact, not a release asset: it's unsigned (Partner
      # Center signs it on ingestion). publish-release.yml submits this exact
      # file to the Store once the release is marked as released. 90 days is
      # the maximum retention — it has to outlive the time the pre-release
      # spends being tested.
      - name: Upload Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-msix-store
          path: build/windows-release/msix/Tesseract-store-x64.msix
          if-no-files-found: error
          retention-days: 90

      # The build jobs run in parallel with no `needs` between them, so a
      # failure here wouldn't otherwise stop the others mid-flight — cancel
      # the whole run so a broken build doesn't burn runner minutes on the
      # rest. Same step is duplicated in every other build job below.
      - name: Cancel workflow run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon) — DragNDrop DMG
  #
  # Developer ID signing + notarization is optional (both macOS jobs). It runs
  # only when ALL of these are set, otherwise an ad-hoc signed DMG is built:
  #   secrets: TESSERACT_MAC_DEVELOPER_ID_P12 (base64 .p12: Developer ID
  #            Application cert + key, with the intermediate),
  #            TESSERACT_MAC_DEVELOPER_ID_P12_PASSWORD,
  #            APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID,
  #            APPSTORE_API_KEY_P8 (App Store Connect API key, .p8 contents)
  #   variable: TESSERACT_MAC_CODESIGN_IDENTITY
  #            (e.g. "Developer ID Application: Name (TEAMID)")
  # ---------------------------------------------------------------------------
  macos-arm64:
    name: macOS arm64 (DMG)
    runs-on: macos-latest
    # Matches CMAKE_OSX_DEPLOYMENT_TARGET (root CMakeLists.txt); also read by
    # CMake, rustc and cc-built C dependencies.
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      # The runner image's default Xcode / Command Line Tools move with every
      # image update, and a linker older than its SDK fails on the new .tbd
      # stubs ("unknown architecture arm64e.x1-macos"). Pin one Xcode so the
      # compiler, linker and SDK always match. DEVELOPER_DIR also reaches
      # rustc and the cc-built C dependencies.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.4.1.app"
          echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
          # A runner-level SDKROOT would make xcrun (and CMake, cc, rustc)
          # keep using the Command Line Tools SDK; point it at Xcode's.
          unset SDKROOT
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "SDKROOT=$sdk"

      - name: Install build dependencies
        run: brew install go resvg autoconf automake libtool

      # Homebrew's opus bottle targets the runner's own macOS, which dyld
      # refuses to load on anything older; build it for the deployment target.
      - name: Build opus from source (arm64)
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPUS_BUILD_SHARED_LIBRARY=ON \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          # Lay opus.pc where Corrosion's PKG_CONFIG_PATH (…/pkgconfig) will find it.
          mkdir -p opus-build/pkgconfig
          cp opus-build/opus.pc opus-build/pkgconfig/
          echo "OPUS_LIB_DIR=$PWD/opus-build" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$PWD/opus-src/include" >> $GITHUB_ENV

      - name: Install Rust (stable, aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          # rust-objcopy (used by rustc to strip release binaries on Apple
          # targets) dynamically links libLLVM.dylib, which only ships
          # alongside this component — without it, stripping silently fails
          # and debug info stays embedded in the shipped binary.
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/macos-appkit-arm64-release/cargo/build
          key: xcode-26.4.1
          cache-on-failure: true

      - name: Check for signing secrets
        id: sign_check
        env:
          P12: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          CODESIGN_IDENTITY: ${{ vars.TESSERACT_MAC_CODESIGN_IDENTITY }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$API_KEY_ID" ] \
             && [ -n "$API_ISSUER_ID" ] && [ -n "$API_KEY_P8" ] && [ -n "$CODESIGN_IDENTITY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not (all) set; building an ad-hoc signed, un-notarized DMG"
          fi

      - name: Import signing certificate and notary credentials
        if: steps.sign_check.outputs.present == 'true'
        env:
          P12: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          CODESIGN_IDENTITY: ${{ vars.TESSERACT_MAC_CODESIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/tesseract-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # The .p12 carries the leaf and Apple's Developer ID intermediate;
          # one import brings in both.
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add to the user search list (keeping existing entries) so codesign finds it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

          echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials tesseract-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Configure (Release, arm64)
        env:
          SIGNING: ${{ steps.sign_check.outputs.present }}
          CODESIGN_IDENTITY: ${{ vars.TESSERACT_MAC_CODESIGN_IDENTITY }}
        run: |
          SIGN_ARGS=()
          if [ "$SIGNING" = "true" ]; then
            SIGN_ARGS=("-DTESSERACT_MAC_CODESIGN_IDENTITY=$CODESIGN_IDENTITY"
                       "-DTESSERACT_MAC_NOTARIZE_PROFILE=tesseract-notary"
                       "-DTESSERACT_MAC_NOTARIZE_KEYCHAIN=$KEYCHAIN_PATH")
          fi
          cmake --preset macos-appkit-arm64-release "-DCMAKE_OSX_SYSROOT=$SDKROOT" "-DCMAKE_EXE_LINKER_FLAGS=-L$SDKROOT/usr/lib" "-DTESSERACT_GITHUB_REPO=${{ github.repository }}" -DTESSERACT_BUILD_TESTS=OFF "${SIGN_ARGS[@]}"
          # Diagnostic: where does a Command Line Tools path enter the link?
          grep -rn CommandLineTools build/macos-appkit-arm64-release/build.ninja | cut -c1-300 | head -n 5 || true

      - name: Build
        run: cmake --build build/macos-appkit-arm64-release

      - name: Check bundled libopus minimum macOS
        run: |
          for f in build/macos-appkit-arm64-release/ui/macos/Tesseract.app/Contents/Frameworks/libopus*.dylib; do
            minos=$(vtool -show-build "$f" | awk '/minos/ {print $2; exit}')
            echo "$f: minos $minos"
            if [ "$(printf '%s\n%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n 1)" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$f needs macOS $minos, newer than the $MACOSX_DEPLOYMENT_TARGET deployment target"
              exit 1
            fi
          done

      - name: Package (CPack → DMG)
        run: cmake --build build/macos-appkit-arm64-release --target package

      - name: Notarize and verify DMG
        if: steps.sign_check.outputs.present == 'true'
        run: |
          cmake --build build/macos-appkit-arm64-release --target notarize
          DMG="$(ls build/macos-appkit-arm64-release/Tesseract-*.dmg | head -n 1)"
          MOUNT="$RUNNER_TEMP/dmg-verify"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Tesseract.app" || { hdiutil detach "$MOUNT"; exit 1; }
          hdiutil detach "$MOUNT"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-macos-arm64
          path: build/macos-appkit-arm64-release/Tesseract-*.dmg
          if-no-files-found: error

      - name: Delete temporary keychain
        if: always() && steps.sign_check.outputs.present == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Cancel workflow run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # macOS universal — Mac App Store .pkg (sandboxed; uploaded by publish-release.yml)
  #
  # Secrets and variables live in the "appstore" environment.
  # Secrets: TESSERACT_MAC_APPSTORE_APP_CERT_P12 (Apple Distribution, base64
  # .p12), TESSERACT_MAC_APPSTORE_INSTALLER_CERT_P12 (3rd Party Mac Developer
  # Installer, base64 .p12), TESSERACT_MAC_APPSTORE_CERT_PASSWORD (password of
  # both .p12 files), TESSERACT_MAC_PROVISIONING_PROFILE_B64 (base64
  # .provisionprofile).
  # Variables: TESSERACT_MAC_APPSTORE_APP_IDENTITY, _INSTALLER_IDENTITY (full
  # certificate names), TESSERACT_MAC_TEAM_ID.
  # Skipped (not failed) when the certificate secrets are missing.
  # ---------------------------------------------------------------------------
  macos-appstore:
    # Disabled until the Mac App Store build is ready; remove this line to re-enable.
    if: false
    name: macOS universal (Mac App Store pkg)
    runs-on: macos-latest
    # Holds the App Store certificates, profile and identity variables.
    environment: appstore
    # Matches CMAKE_OSX_DEPLOYMENT_TARGET (root CMakeLists.txt); also read by
    # CMake, rustc and cc-built C dependencies.
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      # The `secrets` context can't be read in an `if:`; check presence here
      # and gate the remaining steps on this step's output (see the Windows
      # signing check above).
      - name: Check for App Store signing secrets
        id: as_check
        env:
          APP_CERT: ${{ secrets.TESSERACT_MAC_APPSTORE_APP_CERT_P12 }}
          INSTALLER_CERT: ${{ secrets.TESSERACT_MAC_APPSTORE_INSTALLER_CERT_P12 }}
          PROFILE: ${{ secrets.TESSERACT_MAC_PROVISIONING_PROFILE_B64 }}
        run: |
          if [ -n "$APP_CERT" ] && [ -n "$INSTALLER_CERT" ] && [ -n "$PROFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Mac App Store signing secrets missing; skipping the App Store package"
          fi

      - name: Install build dependencies
        if: steps.as_check.outputs.present == 'true'
        run: brew install go resvg autoconf automake libtool

      # libopus is built from source by CMake (cmake/MacUniversal.cmake): the
      # Homebrew bottle targets the runner's own macOS and is single-arch.
      - name: Install Rust (stable, aarch64 + x86_64 targets)
        if: steps.as_check.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        if: steps.as_check.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/macos-appkit-appstore/cargo/build
          key: xcode-26.4.1
          cache-on-failure: true

      # Certificates go into a throwaway keychain; the profile is written
      # under RUNNER_TEMP so neither lands in the checkout.
      - name: Import certificates and provisioning profile
        if: steps.as_check.outputs.present == 'true'
        id: as_import
        env:
          APP_CERT: ${{ secrets.TESSERACT_MAC_APPSTORE_APP_CERT_P12 }}
          INSTALLER_CERT: ${{ secrets.TESSERACT_MAC_APPSTORE_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TESSERACT_MAC_APPSTORE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.TESSERACT_MAC_PROVISIONING_PROFILE_B64 }}
        run: |
          keychain="$RUNNER_TEMP/appstore.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$APP_CERT" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_CERT" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          for f in app installer; do
            security import "$RUNNER_TEMP/$f.p12" -k "$keychain" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/tesseract.provisionprofile"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          echo "profile_path=$RUNNER_TEMP/tesseract.provisionprofile" >> "$GITHUB_OUTPUT"

      # CFBundleVersion = run number: App Store Connect rejects a repeated one.
      - name: Configure (Mac App Store, universal)
        if: steps.as_check.outputs.present == 'true'
        run: |
          cmake --preset macos-appkit-appstore \
            "-DTESSERACT_GITHUB_REPO=${{ github.repository }}" \
            "-DTESSERACT_MAC_APPSTORE_APP_IDENTITY=${{ vars.TESSERACT_MAC_APPSTORE_APP_IDENTITY }}" \
            "-DTESSERACT_MAC_APPSTORE_INSTALLER_IDENTITY=${{ vars.TESSERACT_MAC_APPSTORE_INSTALLER_IDENTITY }}" \
            "-DTESSERACT_MAC_TEAM_ID=${{ vars.TESSERACT_MAC_TEAM_ID }}" \
            "-DTESSERACT_MAC_PROVISIONING_PROFILE=${{ steps.as_import.outputs.profile_path }}" \
            "-DTESSERACT_MAC_BUILD_NUMBER=${{ github.run_number }}"

      - name: Build signed .pkg
        if: steps.as_check.outputs.present == 'true'
        run: cmake --build build/macos-appkit-appstore --target appstore-pkg

      - name: Check bundled libopus minimum macOS
        if: steps.as_check.outputs.present == 'true'
        run: |
          for f in build/macos-appkit-appstore/ui/macos/Tesseract.app/Contents/Frameworks/libopus*.dylib; do
            # A universal dylib prints one build record per slice; check each.
            for minos in $(vtool -show-build "$f" | awk '/minos/ {print $2}'); do
              echo "$f: minos $minos"
              if [ "$(printf '%s\n%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n 1)" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
                echo "::error::$f needs macOS $minos, newer than the $MACOSX_DEPLOYMENT_TARGET deployment target"
                exit 1
              fi
            done
          done

      - name: Upload App Store pkg artifact
        if: steps.as_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-macos-appstore
          path: build/macos-appkit-appstore/Tesseract-*-appstore.pkg
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing keychain
        if: always() && steps.as_check.outputs.present == 'true'
        run: security delete-keychain "$RUNNER_TEMP/appstore.keychain-db" || true

      - name: Cancel workflow run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # macOS x86_64 (Intel) — DragNDrop DMG (signing secrets: see macos-arm64 above)
  # ---------------------------------------------------------------------------
  macos-x86_64:
    name: macOS x86_64 (DMG)
    runs-on: macos-latest
    # Matches CMAKE_OSX_DEPLOYMENT_TARGET (root CMakeLists.txt); also read by
    # CMake, rustc and cc-built C dependencies.
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      # The runner image's default Xcode / Command Line Tools move with every
      # image update, and a linker older than its SDK fails on the new .tbd
      # stubs ("unknown architecture arm64e.x1-macos"). Pin one Xcode so the
      # compiler, linker and SDK always match. DEVELOPER_DIR also reaches
      # rustc and the cc-built C dependencies.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.4.1.app"
          echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
          # A runner-level SDKROOT would make xcrun (and CMake, cc, rustc)
          # keep using the Command Line Tools SDK; point it at Xcode's.
          unset SDKROOT
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "SDKROOT=$sdk"

      - name: Install build dependencies
        run: brew install go resvg autoconf automake libtool

      # macos-latest is arm64; Homebrew only ships an arm64 opus, which won't
      # link into the x86_64 binary. Build opus from source for x86_64 instead
      # (clang cross-compiles fine via CMAKE_OSX_ARCHITECTURES).
      - name: Build opus from source (x86_64)
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPUS_BUILD_SHARED_LIBRARY=ON \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          # Lay opus.pc where Corrosion's PKG_CONFIG_PATH (…/pkgconfig) will find it.
          mkdir -p opus-build/pkgconfig
          cp opus-build/opus.pc opus-build/pkgconfig/
          echo "OPUS_LIB_DIR=$PWD/opus-build" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$PWD/opus-src/include" >> $GITHUB_ENV

      - name: Install Rust (stable, x86_64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          # See the aarch64 job above: rust-objcopy needs llvm-tools-preview's
          # libLLVM.dylib to strip release binaries without dyld-crashing.
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/macos-appkit-x86_64-release/cargo/build
          key: xcode-26.4.1
          cache-on-failure: true

      - name: Check for signing secrets
        id: sign_check
        env:
          P12: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          CODESIGN_IDENTITY: ${{ vars.TESSERACT_MAC_CODESIGN_IDENTITY }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$API_KEY_ID" ] \
             && [ -n "$API_ISSUER_ID" ] && [ -n "$API_KEY_P8" ] && [ -n "$CODESIGN_IDENTITY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not (all) set; building an ad-hoc signed, un-notarized DMG"
          fi

      - name: Import signing certificate and notary credentials
        if: steps.sign_check.outputs.present == 'true'
        env:
          P12: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.TESSERACT_MAC_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          CODESIGN_IDENTITY: ${{ vars.TESSERACT_MAC_CODESIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/tesseract-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # The .p12 carries the leaf and Apple's Developer ID intermediate;
          # one import brings in both.
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add to the user search list (keeping existing entries) so codesign finds it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

          echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials tesseract-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Configure (Release, x86_64)
        env:
          SIGNING: ${{ steps.sign_check.outputs.present }}
          CODESIGN_IDENTITY: ${{ vars.TESSERACT_MAC_CODESIGN_IDENTITY }}
        run: |
          SIGN_ARGS=()
          if [ "$SIGNING" = "true" ]; then
            SIGN_ARGS=("-DTESSERACT_MAC_CODESIGN_IDENTITY=$CODESIGN_IDENTITY"
                       "-DTESSERACT_MAC_NOTARIZE_PROFILE=tesseract-notary"
                       "-DTESSERACT_MAC_NOTARIZE_KEYCHAIN=$KEYCHAIN_PATH")
          fi
          cmake --preset macos-appkit-x86_64-release "-DCMAKE_OSX_SYSROOT=$SDKROOT" "-DCMAKE_EXE_LINKER_FLAGS=-L$SDKROOT/usr/lib" "-DTESSERACT_GITHUB_REPO=${{ github.repository }}" -DTESSERACT_BUILD_TESTS=OFF "${SIGN_ARGS[@]}"
          # Diagnostic: where does a Command Line Tools path enter the link?
          grep -rn CommandLineTools build/macos-appkit-x86_64-release/build.ninja | cut -c1-300 | head -n 5 || true

      - name: Build
        run: cmake --build build/macos-appkit-x86_64-release

      - name: Check bundled libopus minimum macOS
        run: |
          for f in build/macos-appkit-x86_64-release/ui/macos/Tesseract.app/Contents/Frameworks/libopus*.dylib; do
            minos=$(vtool -show-build "$f" | awk '/minos/ {print $2; exit}')
            echo "$f: minos $minos"
            if [ "$(printf '%s\n%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n 1)" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$f needs macOS $minos, newer than the $MACOSX_DEPLOYMENT_TARGET deployment target"
              exit 1
            fi
          done

      - name: Package (CPack → DMG)
        run: cmake --build build/macos-appkit-x86_64-release --target package

      - name: Notarize and verify DMG
        if: steps.sign_check.outputs.present == 'true'
        run: |
          cmake --build build/macos-appkit-x86_64-release --target notarize
          DMG="$(ls build/macos-appkit-x86_64-release/Tesseract-*.dmg | head -n 1)"
          MOUNT="$RUNNER_TEMP/dmg-verify"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Tesseract.app" || { hdiutil detach "$MOUNT"; exit 1; }
          hdiutil detach "$MOUNT"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-macos-x86_64
          path: build/macos-appkit-x86_64-release/Tesseract-*.dmg
          if-no-files-found: error

      - name: Delete temporary keychain
        if: always() && steps.sign_check.outputs.present == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Cancel workflow run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Linux x86_64 — DEB + RPM + AppImage (Qt6 backend, one build shared by all
  # three packaging steps — CPack and the AppImage each just repackage the
  # same build/linux-release output, so there's no reason to compile twice)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x86_64 (DEB + RPM + AppImage)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev \
            qt6-wayland \
            qt6-image-formats-plugins \
            ninja-build \
            libgl-dev \
            libopus-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libwayland-dev \
            libxtst-dev \
            rpm \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            fonts-noto-color-emoji

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(pkg-config --variable=libdir opus)" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$(pkg-config --variable=includedir opus)" >> $GITHUB_ENV
          echo "OPUS_STATIC=1" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/linux-release/cargo/build
          cache-on-failure: true

      - name: Configure (Release)
        run: cmake --preset linux-release -DTESSERACT_UI=qt6 "-DTESSERACT_GITHUB_REPO=${{ github.repository }}" -DTESSERACT_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/linux-release

      - name: Package (CPack → DEB + RPM)
        run: cmake --build build/linux-release --target package

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-deb
          path: build/linux-release/*.deb
          if-no-files-found: error

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-rpm
          path: build/linux-release/*.rpm
          if-no-files-found: error

      - name: Install into AppDir
        run: cmake --install build/linux-release --prefix AppDir/usr

      - name: Bundle emoji font (AppImages skip the .deb/.rpm/Arch runtime dependency)
        run: |
          mkdir -p AppDir/usr/share/fonts AppDir/usr/share/fontconfig AppDir/apprun-hooks
          install -m 644 /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf AppDir/usr/share/fonts/
          install -m 644 packaging/appimage/fonts.conf AppDir/usr/share/fontconfig/tesseract-fonts.conf
          install -m 644 packaging/appimage/apprun-hooks/tesseract-fontconfig.sh AppDir/apprun-hooks/

      - name: Copy Wayland platform/shell/graphics/decoration plugins + Qt Wayland library, fix RPATHs
        run: |
          PLUGINS=$(qmake6 -query QT_INSTALL_PLUGINS)
          LIBS=$(qmake6 -query QT_INSTALL_LIBS)
          mkdir -p AppDir/usr/lib AppDir/usr/plugins/platforms
          # Platform plugins
          cp "$PLUGINS/platforms/libqwayland-generic.so" AppDir/usr/plugins/platforms/
          cp "$PLUGINS/platforms/libqwayland-egl.so"     AppDir/usr/plugins/platforms/ 2>/dev/null || true
          # Sub-plugin directories: shell integrations (xdg-shell etc.),
          # graphics integrations (wayland-egl client buffer), decoration client
          for subdir in wayland-shell-integration wayland-graphics-integration-client wayland-decoration-client; do
            if [ -d "$PLUGINS/$subdir" ]; then
              mkdir -p "AppDir/usr/plugins/$subdir"
              cp "$PLUGINS/$subdir"/*.so "AppDir/usr/plugins/$subdir/" 2>/dev/null || true
            fi
          done
          # patchelf every wayland plugin so its deps resolve inside AppDir/usr/lib
          for f in AppDir/usr/plugins/platforms/libqwayland-*.so \
                   AppDir/usr/plugins/wayland-shell-integration/*.so \
                   AppDir/usr/plugins/wayland-graphics-integration-client/*.so \
                   AppDir/usr/plugins/wayland-decoration-client/*.so; do
            [ -f "$f" ] && patchelf --set-rpath '$ORIGIN/../../lib' "$f"
          done
          # Qt Wayland client lib — dep of all wayland plugins; not auto-bundled
          cp -L "$LIBS/libQt6WaylandClient.so.6" AppDir/usr/lib/
          patchelf --set-rpath '$ORIGIN' AppDir/usr/lib/libQt6WaylandClient.so.6
          
      - name: Download linuxdeploy and Qt + GStreamer plugins
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy-plugin-gstreamer.sh
    
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/bin/qmake6
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --plugin gstreamer \
            --output appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-appimage
          path: Tesseract-*.AppImage
          if-no-files-found: error

      - name: Cancel workflow run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Linux x86_64 — Flatpak: signed, offline sandboxed build, producing the
  # single-file .flatpak bundle attached to the GitHub Release below. Nothing
  # is published to the self-hosted OSTree repo here — publish-release.yml
  # imports this exact bundle into it once the release is marked as released
  # (see packaging/flatpak/README.md for the one-time GPG/Pages setup). Runs
  # only on an actual version tag push — see build-platform.yml for
  # on-demand manual publishing off any ref.
  # ---------------------------------------------------------------------------
  flatpak:
    name: Linux x86_64 (Flatpak bundle)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      # The tag is the only source of truth for what's being published;
      # project() must already agree with it, or the manifest/metainfo below
      # would be substituting/checked against the wrong version.
      - name: Verify tag matches project() version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(grep -oP '(?<=^project\(Tesseract VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag v${tag_version} does not match project(Tesseract VERSION ${project_version})"
            exit 1
          fi
          echo "TESSERACT_VERSION=${tag_version}" >> "$GITHUB_ENV"

      # metainfo.xml can't be edited after the tag is pushed — this is a
      # sanity check that the per-release checklist step wasn't skipped.
      - name: Verify metainfo.xml has a release entry for this version
        run: |
          if ! grep -q "release version=\"${TESSERACT_VERSION}\"" \
              packaging/flatpak/io.github.surakin.Tesseract.metainfo.xml; then
            echo "::error::packaging/flatpak/io.github.surakin.Tesseract.metainfo.xml has no <release version=\"${TESSERACT_VERSION}\"> entry — add one before tagging (see packaging/flatpak/README.md)"
            exit 1
          fi

      - name: Install flatpak-builder + validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          for attempt in 1 2 3 4 5; do
            flatpak install --user -y flathub \
              org.kde.Platform//6.11 org.kde.Sdk//6.11 && exit 0
            echo "::warning::runtime install failed (attempt ${attempt}/5)"
            sleep $((attempt * 20))
          done
          echo "::error::runtime install failed after 5 attempts"
          exit 1

      # Regenerated from this tag's Cargo.lock rather than trusting the
      # tracked copy, which is only a "last known good, for local builds"
      # convenience file per packaging/flatpak/README.md. Pinned to a
      # specific commit for reproducibility (not flatpak-builder-tools'
      # floating master).
      - name: Regenerate cargo-sources.json from the tagged Cargo.lock
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 \
            -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/1fc32195e3e60fe5c97f0af646dec7a99df5962b/cargo/flatpak-cargo-generator.py
          pip install aiohttp tomlkit
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json

      - name: Regenerate the manifest for this tag's version
        run: |
          sed "s/@PROJECT_VERSION@/${TESSERACT_VERSION}/" \
            packaging/flatpak/io.github.surakin.Tesseract.yml.in \
            > packaging/flatpak/io.github.surakin.Tesseract.yml

      # Imported into an ephemeral GNUPGHOME under RUNNER_TEMP, used only to
      # sign, then discarded when the runner is torn down — never written to
      # the checkout or committed anywhere. Not optional: a missing/invalid
      # key fails the job here, at pre-release time, rather than only once
      # publish-release.yml needs the same key to sign the published repo.
      - name: Import Flatpak signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          # ostree/flatpak-builder sign through gpgme, which normally prompts
          # via pinentry for a passphrase-protected key — impossible in
          # headless CI ("Inappropriate ioctl for device"). Switch to
          # loopback pinentry and pre-cache the passphrase in the agent
          # instead, so no interactive prompt is ever attempted.
          cat > "$GNUPGHOME/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          allow-preset-passphrase
          EOF
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          gpgconf --kill gpg-agent || true
          echo "$FLATPAK_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          if [ -n "$FLATPAK_GPG_PASSPHRASE" ]; then
            preset_bin=$(find /usr/lib* -name gpg-preset-passphrase 2>/dev/null | head -1)
            for keygrip in $(gpg --batch --with-colons --with-keygrip --list-secret-keys \
                              | awk -F: '$1=="grp"{print $10}'); do
              "$preset_bin" --preset "$keygrip" <<< "$FLATPAK_GPG_PASSPHRASE"
            done
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_PASSPHRASE=$FLATPAK_GPG_PASSPHRASE" >> "$GITHUB_ENV"

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.github.surakin.Tesseract.yml.in', 'Cargo.lock') }}
          restore-keys: |
            flatpak-builder-

      # Fetched on its own, with retries, so a transient crates.io/GitHub 5xx
      # while downloading the ~700 sources doesn't fail the job (and, through
      # the cancel step below, the whole release run). Downloads land in the
      # cached .flatpak-builder/downloads, so a retry only refetches what is
      # missing and the build below finds every source already there.
      - name: Download sources (retried)
        run: |
          for attempt in 1 2 3 4 5; do
            if flatpak-builder --user --download-only \
                 packaging/flatpak/io.github.surakin.Tesseract.yml build-dir; then
              exit 0
            fi
            echo "::warning::source download failed (attempt ${attempt}/5)"
            sleep $((attempt * 20))
          done
          echo "::error::source download failed after 5 attempts"
          exit 1

      - name: Build (offline, signed)
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --ccache \
            --gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}" \
            --repo=repo build-dir packaging/flatpak/io.github.surakin.Tesseract.yml

      - name: Smoke-test the built tree
        run: test -x build-dir/files/bin/tesseract-matrix

      - name: Build single-file bundle
        run: |
          flatpak build-bundle repo "tesseract-v${TESSERACT_VERSION}.flatpak" \
            io.github.surakin.Tesseract

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-flatpak-bundle
          path: tesseract-v*.flatpak
          if-no-files-found: error

      - name: Cancel workflow run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # GitHub Release — create the pre-release with every user-facing artifact
  # when a version tag is pushed (the Store MSIX stays a workflow artifact on
  # this run). Marking it as released in the GitHub UI triggers
  # publish-release.yml.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos-arm64, macos-x86_64, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/tesseract-windows/Tesseract-*.exe
            dist/tesseract-macos-arm64/Tesseract-*.dmg
            dist/tesseract-macos-x86_64/Tesseract-*.dmg
            dist/tesseract-linux-appimage/Tesseract-*.AppImage
            dist/tesseract-linux-deb/*.deb
            dist/tesseract-linux-rpm/*.rpm
            dist/tesseract-flatpak-bundle/tesseract-*.flatpak
          generate_release_notes: true
