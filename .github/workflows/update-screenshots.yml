# Regenerates the app screenshots on every platform from the deterministic
# screenshot fixture and opens a pull request with them for screenshots/
# against the branch it runs on. Manual runs only.

name: Update App Screenshots

on:
  workflow_dispatch:
    # Untick a platform to skip its job (its screenshots stay as they are).
    inputs:
      linux:
        description: Linux (Qt6 + GTK4)
        type: boolean
        default: true
      macos:
        description: macOS (AppKit)
        type: boolean
        default: true
      windows:
        description: Windows (Win32)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependency installs and toolchain setup mirror build-platform.yml's and
# compile-check.yml's jobs. If you change those there, mirror the change here
# too.

jobs:
  linux:
    if: ${{ inputs.linux }}
    name: Generate Qt6 and GTK4 screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up clang (webrtc-sys needs clang 21 or later)
        uses: ./.github/actions/setup-clang

      # compile-check.yml's Linux list, plus a headless Wayland compositor
      # (labwc, with swaybg and wlr-randr, framing windows with the Greybird
      # Openbox theme) and grim to capture its windows, frame included.
      - name: Install build and display dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev \
            qt6-wayland \
            qt6-image-formats-plugins \
            libgtk-4-dev \
            ninja-build \
            libgl-dev \
            libopus-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev \
            libwayland-dev \
            libxtst-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            fonts-noto-core fonts-noto-color-emoji \
            labwc swaybg wlr-randr grim greybird-gtk-theme

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(pkg-config --variable=libdir opus)" >> "$GITHUB_ENV"
          echo "OPUS_INCLUDE_DIR=$(pkg-config --variable=includedir opus)" >> "$GITHUB_ENV"
          echo "OPUS_STATIC=1" >> "$GITHUB_ENV"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> build/linux-release/cargo/build

      - name: Configure screenshot-only build
        run: >-
          cmake --preset linux-release
          -DTESSERACT_UI=linux
          -DTESSERACT_BUILD_TESTS=OFF
          -DTESSERACT_ENABLE_SCREENSHOT_MODE=ON

      - name: Build Linux apps
        run: cmake --build build/linux-release --target tesseract_qt tesseract_gtk

      - name: Generate deterministic screenshots
        env:
          TZ: UTC
          LANG: C.UTF-8
          XDG_CONFIG_HOME: ${{ runner.temp }}/tesseract-config
          XDG_DATA_HOME: ${{ runner.temp }}/tesseract-data
          XDG_CACHE_HOME: ${{ runner.temp }}/tesseract-cache
          QT_SCALE_FACTOR: '1'
        run: |
          mkdir -p generated-screenshots
          timeout 180s dbus-run-session -- scripts/ci/screenshots/wayland_session.sh \
            build/linux-release/ui/linux-qt/tesseract \
            "--screenshot-dir=$PWD/generated-screenshots"
          timeout 180s dbus-run-session -- scripts/ci/screenshots/wayland_session.sh \
            build/linux-release/ui/linux-gtk/tesseract \
            "--screenshot-dir=$PWD/generated-screenshots"
          for prefix in qt6 gtk4; do
            for theme in light dark; do
              test -s "generated-screenshots/$prefix-$theme.png"
              for scene in thread room-info emoji settings; do
                test -s "generated-screenshots/$prefix-$scene-$theme.png"
              done
            done
          done
          python3 scripts/ci/screenshots/check_size.py generated-screenshots

      - name: Upload refreshed screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tesseract-linux-screenshots
          path: generated-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  appkit:
    if: ${{ inputs.macos }}
    name: Generate AppKit screenshots
    runs-on: macos-latest
    timeout-minutes: 60
    # Matches CMAKE_OSX_DEPLOYMENT_TARGET (root CMakeLists.txt); also read by
    # CMake, rustc and cc-built C dependencies.
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin one Xcode so the compiler, linker and SDK match; the runner
      # image's default moves with every update (see package.yml).
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.4.1.app"
          echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
          # A runner-level SDKROOT would make xcrun (and CMake, cc, rustc)
          # keep using the Command Line Tools SDK; point it at Xcode's.
          unset SDKROOT
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "SDKROOT=$sdk"

      # coreutils provides gtimeout for the capture step.
      - name: Install build dependencies
        run: brew install go resvg autoconf automake libtool coreutils

      # Homebrew's opus bottle targets the runner's own macOS, which dyld
      # refuses to load on anything older; build it for the deployment target.
      - name: Build opus from source (arm64)
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPUS_BUILD_SHARED_LIBRARY=ON \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          # Lay opus.pc where Corrosion's PKG_CONFIG_PATH (…/pkgconfig) will find it.
          mkdir -p opus-build/pkgconfig
          cp opus-build/opus.pc opus-build/pkgconfig/
          echo "OPUS_LIB_DIR=$PWD/opus-build" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$PWD/opus-src/include" >> $GITHUB_ENV

      - name: Install Rust (stable, aarch64 target)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin
          # rust-objcopy (used by rustc to strip release binaries on Apple
          # targets) dynamically links libLLVM.dylib, which only ships
          # alongside this component — without it, stripping silently fails
          # and debug info stays embedded in the shipped binary.
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> build/macos-appkit-arm64-release/cargo/build
          # Same key as prime-rust-cache.yml, which seeds this cache nightly.
          shared-key: macos-arm64-xcode-26.4.1

      - name: Configure screenshot-only build
        run: >-
          cmake --preset macos-appkit-arm64-release
          "-DCMAKE_OSX_SYSROOT=$SDKROOT"
          "-DCMAKE_EXE_LINKER_FLAGS=-L$SDKROOT/usr/lib"
          -DTESSERACT_BUILD_TESTS=OFF
          -DTESSERACT_ENABLE_SCREENSHOT_MODE=ON

      - name: Build AppKit app
        run: cmake --build build/macos-appkit-arm64-release --target tesseract_macos

      - name: Generate deterministic screenshots
        env:
          TZ: UTC
          LANG: en_US.UTF-8
        run: |
          mkdir -p generated-screenshots
          gtimeout 60s \
            build/macos-appkit-arm64-release/ui/macos/Tesseract.app/Contents/MacOS/Tesseract \
            "--screenshot-dir=$PWD/generated-screenshots"
          for theme in light dark; do
            test -s "generated-screenshots/mac-$theme.png"
            for scene in thread room-info emoji settings; do
              test -s "generated-screenshots/mac-$scene-$theme.png"
            done
          done
          python3 scripts/ci/screenshots/check_size.py generated-screenshots

      - name: Upload refreshed screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tesseract-appkit-screenshots
          path: generated-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  windows:
    if: ${{ inputs.windows }}
    name: Generate Win32 screenshots
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> build/windows-release/cargo/build

      # resvg-py 0.3.2 only ships wheels up to cp312, so pin Python 3.12 and
      # hand that exact interpreter to CMake below.
      - name: Set up Python (icon generation)
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install resvg-py (icon generation)
        run: pip install resvg-py

      # Ninja doesn't activate MSVC on its own; without vcvars CMake falls
      # back to the runner's bundled MinGW gcc.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # Build opus from source so its CRT (/MD) matches the rest of the build.
      - name: Build opus from source
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DOPUS_BUILD_SHARED_LIBRARY=OFF `
            -DOPUS_BUILD_PROGRAMS=OFF `
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          $lib = (Resolve-Path opus-build).Path
          $inc = (Resolve-Path opus-src/include).Path
          "OPUS_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "OPUS_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV
          "OPUS_STATIC=1" >> $env:GITHUB_ENV

      - name: Configure screenshot-only build
        run: >-
          cmake --preset windows-release
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
          -DTESSERACT_BUILD_TESTS=OFF
          -DTESSERACT_ENABLE_SCREENSHOT_MODE=ON

      - name: Build Win32 app
        run: cmake --build build/windows-release --target tesseract_win32

      # The runner's display is 1024x768. Windows stops repainting the part of
      # a window that's off-screen, so make room for the 1440x900 capture.
      - name: Raise the display resolution
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController |
            Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      # Tesseract.exe is a GUI-subsystem binary, so the shell doesn't wait for
      # it; Start-Process -PassThru + Wait-Process gives the same 60 s bound
      # the other jobs get from timeout/gtimeout.
      - name: Generate deterministic screenshots
        env:
          TZ: UTC
        run: |
          $out = Join-Path $PWD 'generated-screenshots'
          New-Item -ItemType Directory -Force $out | Out-Null
          $proc = Start-Process -PassThru `
            -FilePath build/windows-release/ui/windows/Tesseract.exe `
            -ArgumentList "--screenshot-dir=$out"
          try { $proc | Wait-Process -Timeout 60 -ErrorAction Stop }
          catch { $proc | Stop-Process -Force; throw 'Screenshot capture timed out' }
          $names = foreach ($theme in 'light', 'dark') {
            "win-$theme.png"
            foreach ($scene in 'thread', 'room-info', 'emoji', 'settings') {
              "win-$scene-$theme.png"
            }
          }
          foreach ($name in $names) {
            $file = Join-Path $out $name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
              throw "$name was not generated"
            }
          }
          python scripts/ci/screenshots/check_size.py $out
          if ($LASTEXITCODE -ne 0) { throw 'Screenshots have the wrong size' }

      - name: Upload refreshed screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tesseract-windows-screenshots
          path: generated-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  # Opens a pull request with the new images for screenshots/ against the
  # branch the run used. The branch is protected (signed commits, pull request,
  # status checks), so the run can't push to it directly. Platforms left
  # unticked keep their current files; a failed platform stops it, so a
  # partial set never lands.
  commit:
    name: Open a pull request with the new screenshots
    needs: [linux, appkit, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the new screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tesseract-*-screenshots
          path: screenshots
          merge-multiple: true

      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f screenshots/debug-*.png
          git add screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git diff --cached --stat
          branch="screenshots/refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "docs(screenshots): refresh the app screenshots" \
                     -m "Generated by ${run_url} from ${GITHUB_SHA}."
          git push origin "$branch"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "docs(screenshots): refresh the app screenshots" \
            --body "Generated by ${run_url} from ${GITHUB_SHA}."
