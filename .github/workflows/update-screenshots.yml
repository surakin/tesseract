name: Update App Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ui/**'
      - 'client/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/update-screenshots.yml'

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependency installs and toolchain setup mirror compile-check.yml's jobs.
# If you change those there, mirror the change here too.

jobs:
  linux:
    name: Generate Qt6 and GTK4 screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # libxtst-dev is a hard configure requirement (livekit-webrtc's
      # screen-grab path links XTest).
      - name: Install build and display dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev \
            qt6-image-formats-plugins \
            libgtk-4-dev \
            ninja-build libgl-dev libopus-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxtst-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            xvfb xauth \
            fonts-noto-color-emoji

      - name: Expose opus to the Rust SDK build
        run: |
          echo "OPUS_LIB_DIR=$(pkg-config --variable=libdir opus)" >> "$GITHUB_ENV"
          echo "OPUS_INCLUDE_DIR=$(pkg-config --variable=includedir opus)" >> "$GITHUB_ENV"
          echo "OPUS_STATIC=1" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/linux-release/cargo/build

      - name: Configure screenshot-only build
        run: >-
          cmake --preset linux-release
          -DTESSERACT_UI=linux
          -DTESSERACT_BUILD_TESTS=OFF
          -DTESSERACT_ENABLE_SCREENSHOT_MODE=ON

      - name: Build Linux apps
        run: cmake --build build/linux-release --target tesseract_qt tesseract_gtk

      - name: Generate deterministic screenshots
        env:
          TZ: UTC
          LANG: C.UTF-8
          XDG_CONFIG_HOME: ${{ runner.temp }}/tesseract-config
          XDG_DATA_HOME: ${{ runner.temp }}/tesseract-data
          XDG_CACHE_HOME: ${{ runner.temp }}/tesseract-cache
          QT_SCALE_FACTOR: '1'
        run: |
          mkdir -p generated-screenshots
          timeout 60s xvfb-run -a -s '-screen 0 1440x1000x24' \
            build/linux-release/ui/linux-qt/tesseract \
            "--screenshot-dir=$PWD/generated-screenshots"
          timeout 60s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' \
            build/linux-release/ui/linux-gtk/tesseract \
            "--screenshot-dir=$PWD/generated-screenshots"
          for prefix in qt6 gtk4; do
            for theme in light dark; do
              test -s "generated-screenshots/$prefix-$theme.png"
              for scene in thread room-info emoji settings; do
                test -s "generated-screenshots/$prefix-$scene-$theme.png"
              done
            done
          done

      - name: Upload refreshed screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-screenshots
          path: generated-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  appkit:
    name: Generate AppKit screenshots (best effort)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # coreutils provides gtimeout for the capture step.
      - name: Install build dependencies
        run: brew install resvg opus coreutils

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(brew --prefix opus)/lib" >> "$GITHUB_ENV"
          echo "OPUS_INCLUDE_DIR=$(brew --prefix opus)/include" >> "$GITHUB_ENV"

      - name: Install Rust (stable, aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          # rust-objcopy (used to strip release binaries on Apple targets)
          # needs the libLLVM.dylib that ships with this component.
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/macos-appkit-arm64-release/cargo/build

      - name: Configure screenshot-only build
        run: >-
          cmake --preset macos-appkit-arm64-release
          -DTESSERACT_BUILD_TESTS=OFF
          -DTESSERACT_ENABLE_SCREENSHOT_MODE=ON

      - name: Build AppKit app
        run: cmake --build build/macos-appkit-arm64-release --target tesseract_macos

      - name: Generate deterministic screenshots
        env:
          TZ: UTC
          LANG: en_US.UTF-8
        run: |
          mkdir -p generated-screenshots
          gtimeout 60s \
            build/macos-appkit-arm64-release/ui/macos/Tesseract.app/Contents/MacOS/Tesseract \
            "--screenshot-dir=$PWD/generated-screenshots"
          for theme in light dark; do
            test -s "generated-screenshots/mac-$theme.png"
            for scene in thread room-info emoji settings; do
              test -s "generated-screenshots/mac-$scene-$theme.png"
            done
          done

      - name: Upload refreshed screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-appkit-screenshots
          path: generated-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Generate Win32 screenshots (best effort)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/windows-release/cargo/build

      # resvg-py 0.3.2 only ships wheels up to cp312, so pin Python 3.12 and
      # hand that exact interpreter to CMake below.
      - name: Set up Python (icon generation)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install resvg-py (icon generation)
        run: pip install resvg-py

      # Ninja doesn't activate MSVC on its own; without vcvars CMake falls
      # back to the runner's bundled MinGW gcc.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Build opus from source so its CRT (/MD) matches the rest of the build.
      - name: Build opus from source
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DOPUS_BUILD_SHARED_LIBRARY=OFF `
            -DOPUS_BUILD_PROGRAMS=OFF `
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          $lib = (Resolve-Path opus-build).Path
          $inc = (Resolve-Path opus-src/include).Path
          "OPUS_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "OPUS_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV
          "OPUS_STATIC=1" >> $env:GITHUB_ENV

      - name: Configure screenshot-only build
        run: >-
          cmake --preset windows-release
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
          -DTESSERACT_BUILD_TESTS=OFF
          -DTESSERACT_ENABLE_SCREENSHOT_MODE=ON

      - name: Build Win32 app
        run: cmake --build build/windows-release --target tesseract_win32

      # Tesseract.exe is a GUI-subsystem binary, so the shell doesn't wait for
      # it; Start-Process -PassThru + Wait-Process gives the same 60 s bound
      # the other jobs get from timeout/gtimeout.
      - name: Generate deterministic screenshots
        env:
          TZ: UTC
        run: |
          $out = Join-Path $PWD 'generated-screenshots'
          New-Item -ItemType Directory -Force $out | Out-Null
          $proc = Start-Process -PassThru `
            -FilePath build/windows-release/ui/windows/Tesseract.exe `
            -ArgumentList "--screenshot-dir=$out"
          try { $proc | Wait-Process -Timeout 60 -ErrorAction Stop }
          catch { $proc | Stop-Process -Force; throw 'Screenshot capture timed out' }
          $names = foreach ($theme in 'light', 'dark') {
            "win-$theme.png"
            foreach ($scene in 'thread', 'room-info', 'emoji', 'settings') {
              "win-$scene-$theme.png"
            }
          }
          foreach ($name in $names) {
            $file = Join-Path $out $name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
              throw "$name was not generated"
            }
          }

      - name: Upload refreshed screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-windows-screenshots
          path: generated-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
