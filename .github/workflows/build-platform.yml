# Companion to package.yml for ad-hoc single/multi-platform test builds.
# Lets you manually pick which platform(s) to build instead of running the
# full 5-platform matrix — useful when only one platform's build is broken
# and you want to iterate on it without waiting on (or re-running) the rest.
#
# This workflow never creates a GitHub Release; it only uploads build
# artifacts for manual download from the Actions run.
#
# NOTE: job bodies here are intentionally duplicated from package.yml rather
# than shared via a reusable workflow, to keep the tag-triggered release
# pipeline untouched. If you change dependency installs, CMake flags, or
# packaging steps in package.yml, mirror the change here too.

name: Build Platform

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Windows (NSIS .exe)'
        type: boolean
        default: true
      macos_arm64:
        description: 'macOS arm64 (DMG)'
        type: boolean
        default: true
      macos_x86_64:
        description: 'macOS x86_64 (DMG)'
        type: boolean
        default: true
      linux_packages:
        description: 'Linux DEB + RPM'
        type: boolean
        default: true
      linux_appimage:
        description: 'Linux AppImage'
        type: boolean
        default: true
      flatpak:
        description: 'Linux Flatpak (slow — full offline Rust+C++ build)'
        type: boolean
        default: false
      flatpak_publish:
        description: 'Flatpak: also sign and publish to GitHub Pages (requires flatpak above; off = validate only, like today)'
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Windows — NSIS installer (.exe)
  # ---------------------------------------------------------------------------
  windows:
    if: ${{ inputs.windows }}
    name: Windows (NSIS)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/windows-release

      # resvg-py 0.3.2 only ships wheels up to cp312, so pin Python 3.12.
      # The id lets us hand the exact interpreter to CMake below — otherwise
      # find_package(Python3) picks the newest interpreter on the runner
      # (3.14 in the hosted toolcache), which has no resvg_py installed.
      - name: Set up Python (icon generation)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install resvg-py (icon generation)
        run: pip install resvg-py

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      # The Ninja generator does not auto-activate MSVC like the Visual Studio
      # generator does. Without vcvars on PATH, CMake's compiler probe can't
      # find cl.exe and silently falls back to the runner's bundled MinGW gcc.
      # This step runs vcvars and exports INCLUDE/LIB/PATH so Ninja picks MSVC.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # opus is required by matrix-sdk-ui (MSC3245 voice messages).
      # Build from source so the CRT (/MD) and generator (Ninja+MSVC) match
      # the rest of the project exactly — avoids vcpkg triplet and GITHUB_ENV
      # encoding issues.
      - name: Build opus from source
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DOPUS_BUILD_SHARED_LIBRARY=OFF `
            -DOPUS_BUILD_PROGRAMS=OFF `
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          $lib = (Resolve-Path opus-build).Path
          $inc = (Resolve-Path opus-src/include).Path
          "OPUS_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "OPUS_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV
          "OPUS_STATIC=1" >> $env:GITHUB_ENV

      # cmake, ninja, Go, and Strawberry Perl are pre-installed on
      # windows-latest; Go and Perl satisfy the aws-lc-sys CMake builder.
      - name: Configure (Release)
        # Force CMake to use the same Python interpreter we installed
        # resvg-py into; otherwise FindPython3 picks the newest version
        # available on the runner (3.14) regardless of PATH.
        run: cmake --preset windows-release "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/windows-release

      - name: Package (CPack → NSIS)
        run: cmake --build build/windows-release --target package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-windows
          path: build/windows-release/Tesseract-*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon) — DragNDrop DMG
  # ---------------------------------------------------------------------------
  macos-arm64:
    if: ${{ inputs.macos_arm64 }}
    name: macOS arm64 (DMG)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install go librsvg autoconf automake libtool opus

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(brew --prefix opus)/lib" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$(brew --prefix opus)/include" >> $GITHUB_ENV

      - name: Install Rust (stable, aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/macos-appkit-arm64-release

      - name: Configure (Release, arm64)
        run: cmake --preset macos-appkit-arm64-release "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/macos-appkit-arm64-release

      - name: Package (CPack → DMG)
        run: cmake --build build/macos-appkit-arm64-release --target package

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-macos-arm64
          path: build/macos-appkit-arm64-release/Tesseract-*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS x86_64 (Intel) — DragNDrop DMG
  # ---------------------------------------------------------------------------
  macos-x86_64:
    if: ${{ inputs.macos_x86_64 }}
    name: macOS x86_64 (DMG)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install go librsvg autoconf automake libtool

      # macos-latest is arm64; Homebrew only ships an arm64 opus, which won't
      # link into the x86_64 binary. Build opus from source for x86_64 instead
      # (clang cross-compiles fine via CMAKE_OSX_ARCHITECTURES).
      - name: Build opus from source (x86_64)
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DOPUS_BUILD_SHARED_LIBRARY=ON \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          # Lay opus.pc where Corrosion's PKG_CONFIG_PATH (…/pkgconfig) will find it.
          mkdir -p opus-build/pkgconfig
          cp opus-build/opus.pc opus-build/pkgconfig/
          echo "OPUS_LIB_DIR=$PWD/opus-build" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$PWD/opus-src/include" >> $GITHUB_ENV

      - name: Install Rust (stable, x86_64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/macos-appkit-x86_64-release

      - name: Configure (Release, x86_64)
        run: cmake --preset macos-appkit-x86_64-release "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/macos-appkit-x86_64-release

      - name: Package (CPack → DMG)
        run: cmake --build build/macos-appkit-x86_64-release --target package

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-macos-x86_64
          path: build/macos-appkit-x86_64-release/Tesseract-*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux x86_64 — DEB + RPM + AppImage (Qt6 backend, one build shared by all
  # three packaging steps — CPack and the AppImage each just repackage the
  # same build/linux-release output, so there's no reason to compile twice).
  # Each packaging step still respects its own toggle, so picking only one of
  # linux_packages/linux_appimage skips the other's steps.
  # ---------------------------------------------------------------------------
  linux:
    if: ${{ inputs.linux_packages || inputs.linux_appimage }}
    name: Linux x86_64 (DEB + RPM + AppImage)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev \
            qt6-wayland \
            qt6-image-formats-plugins \
            ninja-build \
            libgl-dev \
            libopus-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            golang perl \
            libwayland-dev \
            libxtst-dev \
            rpm \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            fonts-noto-color-emoji

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(pkg-config --variable=libdir opus)" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$(pkg-config --variable=includedir opus)" >> $GITHUB_ENV
          echo "OPUS_STATIC=1" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/linux-release

      - name: Configure (Release)
        run: cmake --preset linux-release -DTESSERACT_UI=qt6 "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/linux-release

      - name: Package (CPack → DEB + RPM)
        if: ${{ inputs.linux_packages }}
        run: cmake --build build/linux-release --target package

      - name: Upload DEB artifact
        if: ${{ inputs.linux_packages }}
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-deb
          path: build/linux-release/*.deb
          if-no-files-found: error

      - name: Upload RPM artifact
        if: ${{ inputs.linux_packages }}
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-rpm
          path: build/linux-release/*.rpm
          if-no-files-found: error

      - name: Install into AppDir
        if: ${{ inputs.linux_appimage }}
        run: cmake --install build/linux-release --prefix AppDir/usr

      - name: Bundle emoji font (AppImages skip the .deb/.rpm/Arch runtime dependency)
        if: ${{ inputs.linux_appimage }}
        run: |
          mkdir -p AppDir/usr/share/fonts AppDir/usr/share/fontconfig AppDir/apprun-hooks
          install -m 644 /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf AppDir/usr/share/fonts/
          install -m 644 packaging/appimage/fonts.conf AppDir/usr/share/fontconfig/tesseract-fonts.conf
          install -m 644 packaging/appimage/apprun-hooks/tesseract-fontconfig.sh AppDir/apprun-hooks/

      - name: Copy Wayland platform/shell/graphics/decoration plugins + Qt Wayland library, fix RPATHs
        if: ${{ inputs.linux_appimage }}
        run: |
          PLUGINS=$(qmake6 -query QT_INSTALL_PLUGINS)
          LIBS=$(qmake6 -query QT_INSTALL_LIBS)
          mkdir -p AppDir/usr/lib AppDir/usr/plugins/platforms
          # Platform plugins
          cp "$PLUGINS/platforms/libqwayland-generic.so" AppDir/usr/plugins/platforms/
          cp "$PLUGINS/platforms/libqwayland-egl.so"     AppDir/usr/plugins/platforms/ 2>/dev/null || true
          # Sub-plugin directories: shell integrations (xdg-shell etc.),
          # graphics integrations (wayland-egl client buffer), decoration client
          for subdir in wayland-shell-integration wayland-graphics-integration-client wayland-decoration-client; do
            if [ -d "$PLUGINS/$subdir" ]; then
              mkdir -p "AppDir/usr/plugins/$subdir"
              cp "$PLUGINS/$subdir"/*.so "AppDir/usr/plugins/$subdir/" 2>/dev/null || true
            fi
          done
          # patchelf every wayland plugin so its deps resolve inside AppDir/usr/lib
          for f in AppDir/usr/plugins/platforms/libqwayland-*.so \
                   AppDir/usr/plugins/wayland-shell-integration/*.so \
                   AppDir/usr/plugins/wayland-graphics-integration-client/*.so \
                   AppDir/usr/plugins/wayland-decoration-client/*.so; do
            [ -f "$f" ] && patchelf --set-rpath '$ORIGIN/../../lib' "$f"
          done
          # Qt Wayland client lib — dep of all wayland plugins; not auto-bundled
          cp -L "$LIBS/libQt6WaylandClient.so.6" AppDir/usr/lib/
          patchelf --set-rpath '$ORIGIN' AppDir/usr/lib/libQt6WaylandClient.so.6

      - name: Download linuxdeploy and Qt + GStreamer plugins
        if: ${{ inputs.linux_appimage }}
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy-plugin-gstreamer.sh

      - name: Build AppImage
        if: ${{ inputs.linux_appimage }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/bin/qmake6
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --plugin gstreamer \
            --output appimage

      - name: Upload AppImage artifact
        if: ${{ inputs.linux_appimage }}
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-linux-appimage
          path: Tesseract-*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux x86_64 — Flatpak. Validate-only by default (offline build + smoke
  # test, no signing, no publish); with flatpak_publish also signs and
  # publishes to GitHub Pages on demand, for recovery/republishing/testing
  # without needing a new tag push (package.yml's flatpak job is the fully
  # automatic tag-push path — see packaging/flatpak/README.md).
  # ---------------------------------------------------------------------------
  flatpak:
    if: ${{ inputs.flatpak }}
    name: Linux x86_64 (Flatpak)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flatpak-builder + validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # org.freedesktop.Sdk.Extension.golang is branch-pinned to 24.08 —
          # org.kde.Sdk//6.9's own declared companion branch for
          # org.freedesktop.Sdk.Extension.* (see the manifest's matching
          # comment on rustc version pairing). Flathub publishes many
          # branches of this extension (18.08 through 25.08); left
          # unpinned, `flatpak install` prompts interactively to
          # disambiguate, which silently aborts here (no stdin to answer
          # with in CI).
          flatpak install --user -y flathub \
            org.kde.Platform//6.9 org.kde.Sdk//6.9 \
            org.freedesktop.Sdk.Extension.golang//24.08

      - name: Regenerate the manifest from this commit's project version
        # io.github.surakin.Tesseract.yml is normally CMake-generated from
        # .yml.in (see CMakeLists.txt), substituting the tesseract module's
        # git tag from project(... VERSION ...). Doing the same one
        # substitution with sed here validates the manifest matches the
        # version actually being tagged, without needing the full Qt6/GTK4/
        # GStreamer dependency set just to run a CMake configure. There is no
        # tag/CMakeLists consistency check here (unlike package.yml's job) —
        # this can run off any ref, not necessarily a pushed tag.
        run: |
          version=$(grep -oP '(?<=^project\(Tesseract VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "TESSERACT_VERSION=${version}" >> "$GITHUB_ENV"
          sed "s/@PROJECT_VERSION@/${version}/" packaging/flatpak/io.github.surakin.Tesseract.yml.in \
            > packaging/flatpak/io.github.surakin.Tesseract.yml

      # Kept unconditional (even for validate-only runs) — a real
      # correctness gate independent of whether a tag exists.
      - name: Verify metainfo.xml has a release entry for this version
        run: |
          if ! grep -q "release version=\"${TESSERACT_VERSION}\"" \
              packaging/flatpak/io.github.surakin.Tesseract.metainfo.xml; then
            echo "::error::packaging/flatpak/io.github.surakin.Tesseract.metainfo.xml has no <release version=\"${TESSERACT_VERSION}\"> entry"
            exit 1
          fi

      # The manifest's tesseract module pins `tag: v@PROJECT_VERSION@`,
      # which may not exist as a real pushed tag when running off an
      # arbitrary branch. Point it at this checkout instead (same trick
      # flatpak.yml uses for PR builds) so the build works regardless.
      - name: Point the tesseract module at the checked-out commit
        env:
          SRC_URL: file://${{ github.workspace }}
        run: |
          git switch -C flatpak-ci-build
          M=packaging/flatpak/io.github.surakin.Tesseract.yml
          yq -i '
            (.modules[] | select(.name == "tesseract") | .sources[0]) =
              {"type": "git", "url": strenv(SRC_URL), "branch": "flatpak-ci-build"}
          ' "$M"

      - name: Regenerate cargo-sources.json from this checkout's Cargo.lock
        if: ${{ inputs.flatpak_publish }}
        run: |
          curl -sL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/1fc32195e3e60fe5c97f0af646dec7a99df5962b/cargo/flatpak-cargo-generator.py
          pip install aiohttp tomlkit
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json

      - name: Import Flatpak signing key
        if: ${{ inputs.flatpak_publish }}
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_PASSPHRASE=$FLATPAK_GPG_PASSPHRASE" >> "$GITHUB_ENV"

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.github.surakin.Tesseract.yml.in', 'Cargo.lock') }}
          restore-keys: |
            flatpak-builder-

      - name: Build (offline; signed when publishing)
        run: |
          sign_args=()
          if [ "${{ inputs.flatpak_publish }}" = "true" ]; then
            sign_args=(--gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}")
          fi
          flatpak-builder --user --disable-rofiles-fuse --force-clean --ccache \
            "${sign_args[@]}" --repo=repo build-dir packaging/flatpak/io.github.surakin.Tesseract.yml

      - name: Smoke-test the built artifact
        run: test -x build-dir/files/bin/tesseract-matrix

      - name: Update repo metadata (static deltas, prune)
        if: ${{ inputs.flatpak_publish }}
        run: |
          flatpak build-update-repo --generate-static-deltas --prune --prune-depth=20 \
            --gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}" repo

      - name: Build single-file bundle
        if: ${{ inputs.flatpak_publish }}
        run: |
          flatpak build-bundle repo "tesseract-v${TESSERACT_VERSION}.flatpak" \
            io.github.surakin.Tesseract

      - name: Upload Flatpak bundle artifact
        if: ${{ inputs.flatpak_publish }}
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-flatpak-bundle
          path: tesseract-v*.flatpak
          if-no-files-found: error

      # docs/ isn't touched here — only the Flatpak-specific paths, layered
      # (keep_files: true) onto whatever's already on gh-pages.
      - name: Assemble the Flatpak Pages deploy
        if: ${{ inputs.flatpak_publish }}
        run: |
          mkdir -p pages-deploy
          cp -r repo pages-deploy/flatpak-repo
          cp packaging/flatpak/tesseract.flatpakrepo pages-deploy/
          cp packaging/flatpak/io.github.surakin.Tesseract.flatpakref pages-deploy/

      - name: Deploy Flatpak repo to gh-pages
        if: ${{ inputs.flatpak_publish }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-deploy
          publish_branch: gh-pages
          keep_files: true
