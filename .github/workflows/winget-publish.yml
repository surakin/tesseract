# ---------------------------------------------------------------------------
# Submits a winget-pkgs manifest update PR whenever a GitHub Release is
# published. Only handles UPDATES to an already-published package — the
# very first submission has to go through `wingetcreate submit` by hand
# once (see packaging/winget/README.md), since `wingetcreate update` has
# no upstream manifest yet to diff against.
#
# One-time setup, none of it in this repo:
#   - A GitHub personal access token (classic, `public_repo` scope) for an
#     account that can open PRs against microsoft/winget-pkgs.
#
# Repo configuration (Settings > Secrets and variables > Actions):
#   Secrets:
#     WINGET_TOKEN   the PAT described above
# ---------------------------------------------------------------------------

name: Winget Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)submit, e.g. v0.8.24'
        required: true

jobs:
  publish:
    name: Submit winget-pkgs update
    runs-on: windows-latest

    steps:
      - name: Submit package update
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Tesseract.Matrix
          installers-regex: 'Tesseract-.*-AMD64\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
