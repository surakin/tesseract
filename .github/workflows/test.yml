# Runs the test suites that were previously only run on a maintainer's machine:
#   - Rust unit tests of the SDK (`cargo test -p tesseract-sdk-ffi`);
#   - the translation-completeness gate (`i18n/check_i18n.py`);
#   - the C++ Catch2 suite under ctest, on Linux with the Qt6 shell (the only
#     UI whose test surface compiles in CI today).
#
# Pull requests and manual runs (workflow_dispatch) run it. Packaging jobs in
# package.yml and build-platform.yml build with TESSERACT_BUILD_TESTS=OFF.

name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-i18n:
    name: Rust tests and translation check
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up clang (webrtc-sys needs clang 21 or later)
        uses: ./.github/actions/setup-clang

      # webrtc-sys (livekit) takes glib/gobject/gio headers from pkg-config
      # (all in libglib2.0-dev); audiopus_sys needs the system opus; gettext
      # provides xgettext for i18n/check_i18n.py.
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libglib2.0-dev libopus-dev gettext

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(pkg-config --variable=libdir opus)" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$(pkg-config --variable=includedir opus)" >> $GITHUB_ENV
          echo "OPUS_STATIC=1" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: SDK unit tests
        run: cargo test -p tesseract-sdk-ffi --lib

      - name: Translation catalogs complete
        run: python3 i18n/check_i18n.py .

  cpp-tests:
    name: C++ tests (${{ matrix.name }}, Linux Qt6)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_dir: build/linux-debug
            cmake_args: ""
          # AddressSanitizer on the C++ side only (the Rust SDK is a stable-
          # toolchain static library, uninstrumented). Leak detection is off:
          # Qt, fontconfig and GStreamer leak at exit by design and would fail
          # every run; heap/stack/global errors and use-after-free still trip.
          # jemalloc is off: it exports an unprefixed malloc that replaces
          # ASan's allocator and crashes the binary before main().
          - name: ASan
            build_dir: build/linux-asan
            cmake_args: >-
              "-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer"
              "-DCMAKE_C_FLAGS=-fsanitize=address -fno-omit-frame-pointer"
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address"
              "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"
              -DTESSERACT_ENABLE_JEMALLOC=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Set up clang (webrtc-sys needs clang 21 or later)
        uses: ./.github/actions/setup-clang

      # The same build dependencies as the Linux job in compile-check.yml,
      # which is the reference for this list.
      # fonts-noto-core (Noto Sans) is needed by the tk layout tests: with only
      # the emoji font, text lines are short enough that UserInfo's row stays at
      # its 44 px avatar height and the tests that expect it to grow fail.
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev \
            qt6-wayland \
            qt6-image-formats-plugins \
            libgtk-4-dev \
            ninja-build \
            libgl-dev \
            libopus-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev \
            libwayland-dev \
            libxtst-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            fonts-noto-color-emoji \
            fonts-noto-core \
            dbus \
            gnome-keyring

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(pkg-config --variable=libdir opus)" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$(pkg-config --variable=includedir opus)" >> $GITHUB_ENV
          echo "OPUS_STATIC=1" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ${{ matrix.build_dir }}/cargo/build
          # Distinct per matrix entry: the build dirs (and so the cached
          # target dirs) differ, and the ASan one must not restore Debug's.
          key: ${{ matrix.name }}

      - name: Configure (Debug, tests on)
        run: cmake --preset linux-debug -B ${{ matrix.build_dir }} -DTESSERACT_UI=qt6 "-DTESSERACT_GITHUB_REPO=${{ github.repository }}" ${{ matrix.cmake_args }}

      - name: Build test target
        run: cmake --build ${{ matrix.build_dir }} --target tesseract_tests

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:strict_string_checks=1:detect_stack_use_after_return=1
        # The [keychain] tests use the real libsecret backend, which needs a
        # session bus and an unlocked default collection; a bare runner has
        # neither. The empty password creates the "login" keyring unlocked.
        run: |
          dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ctest --test-dir "$1" --output-on-failure
          ' _ ${{ matrix.build_dir }}
