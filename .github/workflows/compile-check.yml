# Compile-only sanity check across all platforms: no packaging, no artifact
# upload. Meant to be run by hand right before kicking off the real publish
# pipeline (package.yml) to confirm nothing is broken anywhere.
#
# The opt-in windows-xwin job is the one exception: it also builds the NSIS
# installer and uploads it, as a trial of Linux-hosted Windows packaging.
#
# It also runs nightly on the default branch (development). That run exists to
# keep the Rust build caches warm: PRs and tag builds can only restore caches
# saved on their own ref or the default branch, so without it package.yml starts
# every release from a cold cache. Keep the rust-cache keys here identical to
# the ones in package.yml / build-platform.yml for the cache to be shared.
#
# Steps here mirror build-platform.yml's per-platform jobs with every
# packaging step and packaging-only dependency removed. If you change
# dependency installs or CMake flags in build-platform.yml/package.yml,
# mirror the change here too.

name: Compile Check

on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC; off the hour, when runners are busiest
  workflow_dispatch:
    # Untick a platform to skip its job. All three are on by default.
    inputs:
      windows:
        description: Windows
        type: boolean
        default: true
      macos:
        description: macOS (arm64 + x86_64)
        type: boolean
        default: true
      linux:
        description: Linux (GTK4 + Qt6)
        type: boolean
        default: true
      # Experiment: cross-compile Win32 from a Linux runner (clang-cl + xwin)
      # and build the NSIS installer with native makensis, to compare cost and
      # output against the native Windows job. Off by default. The installer
      # is uploaded as an artifact for inspection (unsigned, test-only).
      windows_xwin:
        description: Windows cross-compiled on Linux (xwin) + NSIS installer
        type: boolean
        default: false

concurrency:
  group: compile-check-${{ github.ref }}
  # A manual run must not cancel the nightly cache-warming run mid-build.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  windows:
    if: ${{ github.event_name == 'schedule' || inputs.windows }}
    name: Windows (compile only)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/windows-release/cargo/build

      # resvg-py 0.3.2 only ships wheels up to cp312, so pin Python 3.12.
      # The id lets us hand the exact interpreter to CMake below — otherwise
      # find_package(Python3) picks the newest interpreter on the runner
      # (3.14 in the hosted toolcache), which has no resvg_py installed.
      - name: Set up Python (icon generation)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install resvg-py (icon generation)
        run: pip install resvg-py

      # The Ninja generator does not auto-activate MSVC like the Visual Studio
      # generator does. Without vcvars on PATH, CMake's compiler probe can't
      # find cl.exe and silently falls back to the runner's bundled MinGW gcc.
      # This step runs vcvars and exports INCLUDE/LIB/PATH so Ninja picks MSVC.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # opus is required by matrix-sdk-ui (MSC3245 voice messages).
      # Build from source so the CRT (/MD) and generator (Ninja+MSVC) match
      # the rest of the project exactly — avoids vcpkg triplet and GITHUB_ENV
      # encoding issues.
      - name: Build opus from source
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DOPUS_BUILD_SHARED_LIBRARY=OFF `
            -DOPUS_BUILD_PROGRAMS=OFF `
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          $lib = (Resolve-Path opus-build).Path
          $inc = (Resolve-Path opus-src/include).Path
          "OPUS_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "OPUS_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV
          "OPUS_STATIC=1" >> $env:GITHUB_ENV

      - name: Configure (Release)
        # Force CMake to use the same Python interpreter we installed
        # resvg-py into; otherwise FindPython3 picks the newest version
        # available on the runner (3.14) regardless of PATH.
        run: cmake --preset windows-release "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/windows-release

  # One job definition for both macOS archs. Each arch runs on its own runner
  # (fail-fast off, so one failing doesn't cancel the other). If this works out,
  # package.yml's and build-platform.yml's macOS jobs can follow the same shape.
  macos:
    if: ${{ github.event_name == 'schedule' || inputs.macos }}
    name: macOS ${{ matrix.arch }} (compile only)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            rust_target: x86_64-apple-darwin
    # Matches CMAKE_OSX_DEPLOYMENT_TARGET (root CMakeLists.txt); also read by
    # CMake, rustc and cc-built C dependencies.
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - uses: actions/checkout@v4

      # Pin one Xcode so the compiler, linker and SDK match; the runner
      # image's default moves with every update (see package.yml).
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.4.1.app"
          echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> "$GITHUB_ENV"
          # A runner-level SDKROOT would make xcrun (and CMake, cc, rustc)
          # keep using the Command Line Tools SDK; point it at Xcode's.
          unset SDKROOT
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "SDKROOT=$sdk"

      - name: Install build dependencies
        run: brew install go resvg autoconf automake libtool

      # Homebrew only ships an arm64 opus for the arm64 runner, which can't link
      # into the x86_64 build; build it for the matrix arch and the deployment
      # target instead (same as package.yml).
      - name: Build opus from source
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          cmake -S opus-src -B opus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPUS_BUILD_SHARED_LIBRARY=ON \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build
          # Lay opus.pc where Corrosion's PKG_CONFIG_PATH (…/pkgconfig) will find it.
          mkdir -p opus-build/pkgconfig
          cp opus-build/opus.pc opus-build/pkgconfig/
          echo "OPUS_LIB_DIR=$PWD/opus-build" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$PWD/opus-src/include" >> $GITHUB_ENV

      - name: Install Rust (stable, ${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          # rust-objcopy (used by rustc to strip release binaries on Apple
          # targets) dynamically links libLLVM.dylib, which only ships
          # alongside this component — without it, stripping silently fails
          # and debug info stays embedded in the shipped binary.
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/macos-appkit-${{ matrix.arch }}-release/cargo/build
          # Shared with package.yml / build-platform.yml so this run seeds
          # their cache; the job id is the same for both archs, so key on arch.
          shared-key: macos-${{ matrix.arch }}-xcode-26.4.1

      - name: Configure (Release, ${{ matrix.arch }})
        run: cmake --preset macos-appkit-${{ matrix.arch }}-release "-DCMAKE_OSX_SYSROOT=$SDKROOT" "-DCMAKE_EXE_LINKER_FLAGS=-L$SDKROOT/usr/lib" "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/macos-appkit-${{ matrix.arch }}-release

  linux:
    if: ${{ github.event_name == 'schedule' || inputs.linux }}
    name: Linux GTK4 + Qt6 (compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # TESSERACT_UI=linux builds both shells from one build dir, so the GTK4
      # and Qt6 backends share this single job (and one Rust/SDK build) rather
      # than each getting a runner of their own.
      #
      # libgtk-4-dev covers the GTK4 shell; its tray is a pure
      # StatusNotifierItem D-Bus implementation, so no appindicator/GTK3
      # package is needed. libsecret-1-dev is optional but recommended on
      # Linux for the credential store. The Qt packages and libwayland-dev are
      # for the Qt6 shell's xdg-activation-v1 window raising.
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev \
            qt6-wayland \
            qt6-image-formats-plugins \
            libgtk-4-dev \
            ninja-build \
            libgl-dev \
            libopus-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev \
            libwayland-dev \
            libxtst-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            fonts-noto-color-emoji

      - name: Expose opus to audiopus_sys
        run: |
          echo "OPUS_LIB_DIR=$(pkg-config --variable=libdir opus)" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=$(pkg-config --variable=includedir opus)" >> $GITHUB_ENV
          echo "OPUS_STATIC=1" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/linux-release/cargo/build

      # Tests stay on. Under TESSERACT_UI=linux the test target picks the Qt6
      # TestSurface (tests/CMakeLists.txt maps "linux" to "qt6"), so the GTK
      # test surface — which cannot compile, as it includes cairo.h without
      # tests/CMakeLists.txt ever running pkg_check_modules for it — is not
      # compiled at all. That pre-existing gap needs no workaround here.
      - name: Configure (Release)
        run: cmake --preset linux-release -DTESSERACT_UI=linux "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/linux-release

  windows-xwin:
    if: ${{ inputs.windows_xwin }}
    name: Windows via xwin (compile + NSIS installer)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # The MSVC STL in the xwin sysroot needs clang >= 19 (yvals_core.h
      # STL1000), newer than Ubuntu 24.04's default clang 18, so take LLVM
      # from apt.llvm.org.
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build nsis gettext python3-venv
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y lld-20

      # Ubuntu links only versioned names (clang-18, lld-link-18, ...) into
      # /usr/bin; the unversioned clang-cl / lld-link / llvm-lib / llvm-rc /
      # llvm-mt the toolchain file expects live in /usr/lib/llvm-N/bin.
      - name: Put unversioned LLVM tools on PATH
        run: |
          llvm_bin="$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n1)"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          PATH="$llvm_bin:$PATH"
          for t in clang-cl lld-link llvm-lib llvm-rc llvm-mt; do command -v "$t"; done

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/windows-xwin-release/cargo/build

      # Keyed on the setup script so a change to it refreshes the sysroot.
      # Running the script accepts Microsoft's CRT/SDK license terms.
      - name: Cache xwin sysroot
        id: xwin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/xwin
          key: xwin-${{ runner.os }}-${{ hashFiles('cmake/toolchains/xwin-setup.sh') }}

      - name: Set up xwin sysroot
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: cmake/toolchains/xwin-setup.sh --accept-license

      # Tests are off: Catch2 discovery would try to run the Windows
      # tesseract_tests.exe at build time, and the runner has no Wine.
      - name: Configure (Release, xwin)
        run: cmake --preset windows-xwin-release -DTESSERACT_BUILD_TESTS=OFF "-DTESSERACT_GITHUB_REPO=${{ github.repository }}"

      - name: Build
        run: cmake --build build/windows-xwin-release

      - name: Package (CPack → NSIS)
        run: cmake --build build/windows-xwin-release --target package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-windows-xwin
          path: build/windows-xwin-release/Tesseract-*.exe
          retention-days: 7
