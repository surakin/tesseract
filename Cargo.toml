[workspace]
members  = ["sdk"]
resolver = "2"

# Third-party dependencies (matrix-sdk, tokio, rustls, webrtc-sys, ...) are a
# huge, generic-heavy tree; full debug info (the profile.dev default) makes
# their debug rlibs enormous. Trim deps to line-tables-only — still gives
# file:line backtraces and lets you step through library frames, just without
# pretty-printed locals in their internals. tesseract-sdk-ffi itself is a
# workspace member so it's governed by [profile.dev] below, not this table,
# and keeps full debug info for breakpoint/variable inspection in our code.
[profile.dev.package."*"]
debug = "line-tables-only"

# Use our fork instead of the upstream crates.io releases. matrix-sdk-base and
# matrix-sdk-ui come along via path deps within the fork's own workspace, as
# do the transitive matrix-sdk-crypto/-common/-sqlite/-qrcode/-indexeddb/
# -store-encryption crates.
[patch.crates-io]
matrix-sdk      = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "1d1c0cbbd8f903a079dd07a9ca6a71449da01f1c" }
matrix-sdk-base = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "1d1c0cbbd8f903a079dd07a9ca6a71449da01f1c" }
matrix-sdk-ui   = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "1d1c0cbbd8f903a079dd07a9ca6a71449da01f1c" }
# The fork's matrix-sdk now depends on its own ruma fork/rev directly (a git
# source) rather than crates.io ruma. Our own sdk/ code takes ruma types
# (RoomId, events, ...) straight from matrix-sdk's return values, so our
# ruma dependency must resolve to the exact same source+rev or those types
# won't unify at compile time. Keep this rev in lockstep with whatever rev
# matrix-sdk's Cargo.lock (in the fork repo) pins for `ruma` at the commit
# above.
ruma = { git = "https://github.com/ruma/ruma", rev = "0908aaa9847093ecb32bc6edf0af525f726717fd" }
