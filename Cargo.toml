[workspace]
members  = ["sdk"]
resolver = "2"

# Warnings are errors for first-party crates in every configuration (plain
# `cargo test` as well as the CMake/Corrosion build). Dependencies are capped
# by cargo and unaffected.
[workspace.lints.rust]
warnings = "deny"

# Third-party dependencies (matrix-sdk, tokio, rustls, webrtc-sys, ...) are a
# huge, generic-heavy tree; full debug info (the profile.dev default) makes
# their debug rlibs enormous. Trim deps to line-tables-only — still gives
# file:line backtraces and lets you step through library frames, just without
# pretty-printed locals in their internals. tesseract-sdk-ffi itself is a
# workspace member so it's governed by [profile.dev] below, not this table,
# and keeps full debug info for breakpoint/variable inspection in our code.
[profile.dev.package."*"]
debug = "line-tables-only"

# Use our fork instead of the upstream crates.io releases (pinned to f4a94ad61,
# upstream main of 2026-11-19, which uses ruma 0.17.2 at c51459505). matrix-sdk-base and
# matrix-sdk-ui come along via path deps within the fork's own workspace, as do
# the transitive matrix-sdk-crypto/-common/-sqlite/-qrcode/-indexeddb/
# -store-encryption crates. The fork takes ruma from git, so ruma is patched to
# the same rev (c51459505, ruma 0.17.2) to keep a single ruma copy.
[patch.crates-io]
matrix-sdk      = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "f4a94ad6141846f9ddaa8be5117260d1311196b9" }
matrix-sdk-base = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "f4a94ad6141846f9ddaa8be5117260d1311196b9" }
matrix-sdk-ui   = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "f4a94ad6141846f9ddaa8be5117260d1311196b9" }
ruma            = { git = "https://github.com/ruma/ruma", rev = "c514595056812f45753b2ec1a823c33bafce6b7f" }
