[workspace]
members  = ["sdk"]
resolver = "2"

# Third-party dependencies (matrix-sdk, tokio, rustls, webrtc-sys, ...) are a
# huge, generic-heavy tree; full debug info (the profile.dev default) makes
# their debug rlibs enormous. Trim deps to line-tables-only — still gives
# file:line backtraces and lets you step through library frames, just without
# pretty-printed locals in their internals. tesseract-sdk-ffi itself is a
# workspace member so it's governed by [profile.dev] below, not this table,
# and keeps full debug info for breakpoint/variable inspection in our code.
[profile.dev.package."*"]
debug = "line-tables-only"

# Use our fork instead of the upstream crates.io releases (pinned to 50801276e,
# upstream main's "Upgrade ruma" commit of 2026-10-25, the first after the
# matrix-sdk-ffi/20261020 tag to use ruma 0.17.2). matrix-sdk-base and
# matrix-sdk-ui come along via path deps within the fork's own workspace, as do
# the transitive matrix-sdk-crypto/-common/-sqlite/-qrcode/-indexeddb/
# -store-encryption crates. The fork takes ruma from git, so ruma is patched to
# the same rev (f99fc5c53, ruma 0.17.2) to keep a single ruma copy.
[patch.crates-io]
matrix-sdk      = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "50801276e8d2808d0dd51f37921e0354c82eae37" }
matrix-sdk-base = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "50801276e8d2808d0dd51f37921e0354c82eae37" }
matrix-sdk-ui   = { git = "https://github.com/surakin/matrix-rust-sdk.git", rev = "50801276e8d2808d0dd51f37921e0354c82eae37" }
ruma            = { git = "https://github.com/ruma/ruma", rev = "f99fc5c53a7ee3057a9203f76a0ad12839d67be6" }
