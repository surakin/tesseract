<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Points fontconfig at the emoji font bundled in ../fonts (relative to this
  file, wherever the AppImage happens to be mounted at run time) while still
  pulling in the host's own fontconfig setup, so every other font keeps
  resolving exactly as it would outside the AppImage. Selected via
  FONTCONFIG_FILE by apprun-hooks/tesseract-fontconfig.sh.
-->
<fontconfig>
  <dir prefix="relative">../fonts</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
